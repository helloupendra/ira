# Ira for iPhone, as an Xcode project: `xcodegen generate` (scripts/ci.sh does it)
# writes Ira.xcodeproj from this file. The project is never committed: this file
# and the sources are the whole truth, so a change reviews as a few lines here.
name: Ira
options:
  bundleIdPrefix: io.github.helloupendra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Empty on purpose: no Apple account is named in this repository. To install
    # on an iPhone, choose your team in Xcode (Signing & Capabilities), or pass
    # DEVELOPMENT_TEAM=... to xcodebuild. The simulator needs none.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  IraPhoneKit:
    path: IraPhoneKit
targets:
  Ira:
    type: application
    platform: iOS
    sources:
      - path: Ira
        excludes:
          - Info.plist
    dependencies:
      - package: IraPhoneKit
    settings:
      base:
        PRODUCT_NAME: Ira
        PRODUCT_BUNDLE_IDENTIFIER: io.github.helloupendra.ira
        INFOPLIST_FILE: Ira/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  IraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IraUITests
    dependencies:
      - target: Ira
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.helloupendra.ira.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ira
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Ira:
    build:
      targets:
        Ira: all
        IraUITests: [test]
    test:
      config: Debug
      targets:
        - IraUITests
