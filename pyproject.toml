[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ira-assistant"
version = "0.2.0"
description = "A self-hosted voice assistant over your own data and tools, with PIN-confirmed actions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Upendra Singh Chauhan" }]
requires-python = ">=3.11"
keywords = ["assistant", "voice", "llm", "tools", "fastapi", "telegram", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    # The device WebSocket (uvicorn serves WebSockets through it) and pairing QR codes.
    "websockets>=14",
    "segno>=1.6",
    # Drop: files arrive as multipart uploads, and are kept encrypted (as connections' secrets are).
    "python-multipart>=0.0.9",
    "cryptography>=43",
    # Windows has no time-zone database of its own; without this every ask fails there
    # (ZoneInfoNotFoundError, even for UTC).
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# SigV4 signing for Amazon Bedrock (Mantle endpoint) and Amazon Polly.
aws = ["botocore>=1.34"]
# Telegram voice notes arrive as OGG/Opus. soundfile (BSD-3-Clause) bundles
# libsndfile (LGPL-2.1+) with Opus support; ffmpeg on PATH also works.
ogg = ["soundfile>=0.12"]
# Each person's connections to MCP servers (GitHub and others), secrets sealed at rest.
connectors = ["mcp>=2.3,<3", "telethon>=1.45,<2"]
dev = [
    "pytest>=8",
    "ruff==0.16.9",
    "pre-commit>=3.7",
    "detect-secrets==1.5.0",
]

[project.scripts]
ira = "ira.cli:main"

[project.urls]
Homepage = "https://github.com/helloupendra/ira"
Issues = "https://github.com/helloupendra/ira/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ira"]

# The Mac installer and the Chrome extension, so a server can offer them as downloads.

[tool.hatch.build.targets.sdist]
include = ["src/ira", "tests", "examples", "docs", "deploy", "clients", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient nudges towards a newer HTTP client; not our concern.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "ira.channels.deps.require",
    "ira.channels.deps.require_session",
]

[tool.ruff.lint.isort]
known-first-party = ["ira"]
