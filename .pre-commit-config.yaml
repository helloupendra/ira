# Install once per clone:  pip install pre-commit && pre-commit install
# Run on everything:       pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: ira-denylist
        name: private deny-list (~/.config/ira/denylist.txt)
        entry: python scripts/check_denylist.py
        language: python
        types: [file]
      - id: ira-identity
        name: commit identity is a GitHub no-reply address
        entry: python scripts/check_identity.py
        language: python
        pass_filenames: false
        always_run: true
