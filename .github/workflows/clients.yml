name: Clients

# Builds the Mac installer and the Chrome extension zips: as workflow artifacts on
# every push to main, and attached to the GitHub Release of each v* tag. Nothing is
# signed: no signing key exists in this repository or its secrets yet.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to attach the zips to a tag's release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the zips
        run: python src/ira/clients.py dist # only the standard library: no install needed
      - uses: actions/upload-artifact@v4
        with:
          name: ira-clients
          path: dist/*.zip
      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
