name: Clients

# Builds Ira for Mac: as a workflow artifact on every push to main, and attached
# to the GitHub Release of each v* tag as Ira.dmg (the name /v1/downloads links
# to) and Ira-<version>.dmg. It is signed ad hoc: no signing key exists in this
# repository or its secrets.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write # only to attach the dmg to a tag's release
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - uses: actions/checkout@v6
      - name: Build Ira.app, the zip and the dmg
        run: UNIVERSAL=1 scripts/make-app.sh
      - name: Name the dmg for the latest-release link
        run: cp dist/Ira-*.dmg dist/Ira.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ira-for-mac
          path: |
            clients/macos/dist/*.dmg
            clients/macos/dist/*.zip
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --clobber
