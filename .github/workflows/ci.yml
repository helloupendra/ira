name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly full-history secret scan

permissions:
  contents: read

# No cloud, chat or model credentials exist in this workflow on purpose.
# Every test runs against fakes.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.9"
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,aws,ogg,connectors]"
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: admin/.nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      # The console build is committed so `pip install` needs no Node. This
      # proves the committed bundle is the one the source produces.
      - name: Committed console build matches the source
        run: git diff --exit-code -- ../src/ira/web/admin

  macos-app:
    # Ira for Mac: built with Swift Package Manager, as on a Mac with only the
    # Command Line Tools. The zip and dmg are kept as this run's artifacts.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - run: swift build
      - run: scripts/test.sh
      - run: UNIVERSAL=1 scripts/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ira-mac-app
          path: |
            clients/macos/dist/Ira-*.zip
            clients/macos/dist/Ira-*.dmg
          if-no-files-found: error

  android-app:
    # Ira for Android: JVM unit tests and both debug APKs (the Google Play build and
    # the personal build), kept as this run's artifacts. Nothing is signed here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      # Caches Gradle, and checks the wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --no-daemon test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ira-android-debug
          path: clients/android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  ios-app:
    # Ira for iPhone: the kit's tests and the app's UI tests on an iOS simulator,
    # against a local Ira with the demo model and fake speech, and an unsigned
    # simulator build kept as this run's artifact. No Apple account, certificate
    # or key exists in this workflow; a TestFlight build is signed elsewhere
    # (docs/clients/iphone.md).
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: clients/ios
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ../..
      - run: brew install xcodegen
      - run: xcodebuild -version && xcodegen --version
      - name: Start a local Ira for the tests
        run: scripts/local-ira.sh >> "$GITHUB_ENV"
      - name: Boot an iPhone simulator
        run: scripts/ci.sh simulator
        timeout-minutes: 10
      - name: IraPhoneKit's tests on the simulator
        run: scripts/ci.sh kit
        timeout-minutes: 25
      - name: The app and its UI tests
        run: scripts/ci.sh app
        timeout-minutes: 25
      - name: An unsigned Release build for the simulator
        run: scripts/ci.sh release
        timeout-minutes: 15
      - name: The local Ira's log
        if: failure()
        run: cat "$IRA_TEST_DIR/serve.log"
      - uses: actions/upload-artifact@v4
        with:
          name: ira-ios-simulator
          path: clients/ios/dist/Ira-simulator.zip
          if-no-files-found: error

  secrets:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets gitleaks comment on a PR that adds a secret
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # On pull requests this scans the PR's commits and comments on the PR;
      # on schedule and manual runs it scans everything. GITHUB_TOKEN is the
      # automatic per-run token: a personal-account repository needs no stored
      # secret. Pushes are covered by the full scan below, because the
      # action's commit-range scan has no parent to start from on a first push.
      - uses: gitleaks/gitleaks-action@v3
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Full-history scan (every commit, every branch)
        env:
          VERSION: "8.24.3"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfLO "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
