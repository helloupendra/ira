name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly full-history secret scan

permissions:
  contents: read

# No cloud, chat or model credentials exist in this workflow on purpose.
# Every test runs against fakes.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.9"
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,aws,ogg]"
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: admin/.nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      # The console build is committed so `pip install` needs no Node. This
      # proves the committed bundle is the one the source produces.
      - name: Committed console build matches the source
        run: git diff --exit-code -- ../src/ira/web/admin

  chrome-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/chrome-extension
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/chrome-extension/package-lock.json
      - run: npm ci
      - run: npm test
      - name: The manifest is valid JSON with the pinned key
        run: node -e "const m = require('./manifest.json'); if (!m.key || m.manifest_version !== 3) process.exit(1)"

  mac-companion:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS's own Python (Command Line Tools) is 3.9; the companion must run on it.
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          # The Keychain and the installer's dry run need macOS.
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/mac
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "websockets>=13" "pytest>=8"
      - if: runner.os == 'macOS'
        run: brew install shellcheck
      - run: python -m pytest

  secrets:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets gitleaks comment on a PR that adds a secret
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # On pull requests this scans the PR's commits and comments on the PR;
      # on schedule and manual runs it scans everything. GITHUB_TOKEN is the
      # automatic per-run token: a personal-account repository needs no stored
      # secret. Pushes are covered by the full scan below, because the
      # action's commit-range scan has no parent to start from on a first push.
      - uses: gitleaks/gitleaks-action@v3
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Full-history scan (every commit, every branch)
        env:
          VERSION: "8.24.3"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfLO "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
