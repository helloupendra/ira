name: Pages

# The public site: the landing page in site/ at the root, and the MkDocs
# documentation under /docs/. Relative links only, so the same build works
# under /ira/ on github.io and at the root of a custom domain.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a
# deployment halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

# No secrets of any kind: deploy-pages authenticates with the run's own
# short-lived OIDC token.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Build the docs
        env:
          NO_MKDOCS_2_WARNING: "true" # MkDocs is pinned to 1.x in docs/requirements.txt
        run: mkdocs build --strict # into build/docs (site_dir in mkdocs.yml)
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R build/docs _site/docs
          find _site -maxdepth 2 | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
