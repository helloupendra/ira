<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="description" content="Hey Ira: your own voice assistant.">
  <title>Ira</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main id="app">
    <section id="view-loading" class="view card center">
      <p class="muted">Loading...</p>
    </section>

    <section id="view-setup" class="view card" hidden>
      <h1>Set up <span class="brand-name">Ira</span></h1>
      <p class="muted">Create the owner account. The setup code is printed in the server log.</p>
      <form id="setup-form" class="stack">
        <label>Email <input name="email" type="email" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
        <label>Setup code <input name="setup_code" autocomplete="off" required></label>
        <button type="submit">Create owner</button>
        <p class="error" role="alert"></p>
      </form>
    </section>

    <section id="view-login" class="view card" hidden>
      <h1>Hey <span class="brand-name">Ira</span></h1>
      <form id="login-form" class="stack">
        <label>Email <input name="email" type="email" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
        <p class="error" role="alert"></p>
      </form>
    </section>

    <section id="view-chat" class="view chat" hidden>
      <header class="bar">
        <div class="title">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="/icon.svg#mark"></use></svg>
          <span class="brand-name">Ira</span>
        </div>
        <label class="toggle"><input id="speak-toggle" type="checkbox"> <span class="long">Speak replies</span><span class="short">Speak</span></label>
        <button id="new-chat" class="ghost" type="button" title="Start a new conversation">New</button>
        <button id="logout" class="ghost" type="button">Sign out</button>
      </header>

      <ol id="messages" class="messages" aria-live="polite"></ol>

      <template id="action-template">
        <li class="action-card">
          <p class="action-title">Needs your PIN</p>
          <p class="action-summary"></p>
          <form class="action-form">
            <input class="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" autocomplete="off" placeholder="PIN" aria-label="Action PIN" required>
            <button type="submit">Confirm</button>
            <button type="button" class="ghost cancel">Cancel</button>
          </form>
          <p class="action-status muted"></p>
        </li>
      </template>

      <form id="composer" class="composer">
        <button id="mic" type="button" class="mic" title="Tap to record, tap again to send" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <input id="text" name="text" autocomplete="off" placeholder="Ask anything..." maxlength="4000">
        <button type="submit">Send</button>
      </form>
      <p id="status" class="status muted"></p>
    </section>
  </main>
</body>
</html>
