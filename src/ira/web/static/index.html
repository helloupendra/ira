<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Hey Ira: your own voice assistant.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Ira</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main id="app">
    <section id="view-loading" class="view gate" aria-busy="true">
      <p class="muted">Loading…</p>
    </section>

    <section id="view-setup" class="view gate" hidden>
      <form id="setup-form" class="gate-card stack" autocomplete="on">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="/icon.svg#mark"></use></svg>
        <h1>Set up <span class="brand-name">Ira</span></h1>
        <p class="muted">No account exists yet. Create the owner's account with the one-time setup code that <code>ira serve</code> printed where the server runs.</p>
        <label>Setup code <input name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required></label>
        <label>Your email <input name="email" type="email" autocomplete="username" inputmode="email" required></label>
        <label>Password (10 characters or more) <input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
        <button type="submit" class="btn btn-primary">Create the owner account</button>
        <p class="error" role="alert"></p>
      </form>
    </section>

    <section id="view-login" class="view gate" hidden>
      <form id="login-form" class="gate-card stack" autocomplete="on">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="/icon.svg#mark"></use></svg>
        <h1>Hey <span class="brand-name">Ira</span></h1>
        <p id="login-note" class="note" hidden></p>
        <label>Email <input name="email" type="email" autocomplete="username" inputmode="email" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn btn-primary">Sign in</button>
        <p class="error" role="alert"></p>
      </form>
    </section>

    <section id="view-chat" class="view chat" hidden>
      <header class="top">
        <button id="menu-open" type="button" class="icon-btn" aria-label="Menu" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="title"><span class="brand-name">Ira</span></h1>
        <button id="new-chat" type="button" class="text-btn">New</button>
      </header>

      <div id="banner" class="banner" role="status" hidden></div>

      <div id="scroll" class="scroll">
        <div id="hero" class="hero">
          <button id="hero-mic" type="button" class="voice-mark hero-mark" aria-label="Tap to talk">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <rect class="bar" x="7" y="13" width="3" height="6" rx="1.5"/>
              <rect class="bar" x="12" y="9" width="3" height="14" rx="1.5"/>
              <rect class="bar" x="17" y="6" width="3" height="20" rx="1.5"/>
              <rect class="bar" x="22" y="11" width="3" height="10" rx="1.5"/>
            </svg>
          </button>
          <p id="hero-hint" class="hero-hint">Tap to talk, or type below.</p>
        </div>
        <ol id="messages" class="messages" aria-label="Conversation"></ol>
      </div>

      <p id="status" class="status" role="status"></p>
      <div id="announce" class="sr-only" aria-live="polite"></div>

      <form id="composer" class="composer">
        <button id="mic" type="button" class="voice-mark mic" aria-label="Tap to talk" aria-pressed="false">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect class="bar" x="7" y="13" width="3" height="6" rx="1.5"/>
            <rect class="bar" x="12" y="9" width="3" height="14" rx="1.5"/>
            <rect class="bar" x="17" y="6" width="3" height="20" rx="1.5"/>
            <rect class="bar" x="22" y="11" width="3" height="10" rx="1.5"/>
          </svg>
        </button>
        <input id="text" name="text" autocomplete="off" enterkeyhint="send" placeholder="Ask anything…" aria-label="Ask Ira" maxlength="4000">
        <button id="send" type="submit" class="icon-btn send" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
        </button>
      </form>

      <div id="listen" class="listen" hidden>
        <svg class="meter" viewBox="0 0 32 32" aria-hidden="true">
          <rect class="bar" x="7" y="13" width="3" height="6" rx="1.5"/>
          <rect class="bar" x="12" y="9" width="3" height="14" rx="1.5"/>
          <rect class="bar" x="17" y="6" width="3" height="20" rx="1.5"/>
          <rect class="bar" x="22" y="11" width="3" height="10" rx="1.5"/>
        </svg>
        <p class="listen-text"><span id="listen-label">Listening…</span> <span id="handsfree-chip" class="chip" hidden>Hands-free on</span></p>
        <div class="listen-actions">
          <button id="listen-done" type="button" class="btn btn-primary">Done</button>
          <button id="listen-cancel" type="button" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="menu" class="menu" aria-labelledby="menu-title">
    <div class="menu-head">
      <h2 id="menu-title">Settings</h2>
      <button id="menu-close" type="button" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="menu-user"><span id="menu-email"></span> <span id="menu-role" class="chip"></span></p>
    <div class="menu-history">
      <p class="menu-label">Today's conversations</p>
      <ul id="history-list" class="history" aria-label="Today's conversations"></ul>
    </div>
    <label class="switch"><input id="speak-toggle" type="checkbox"> <span>Speak replies aloud</span></label>
    <label class="switch"><input id="handsfree-toggle" type="checkbox"> <span>Hands-free: listen again after each spoken reply</span></label>
    <div class="menu-pin">
      <p id="pin-status" class="menu-user"></p>
      <button id="pin-open" type="button" class="btn btn-ghost" hidden>Set your PIN</button>
      <form id="pin-form" class="stack" hidden>
        <label>Your password <input name="password" type="password" autocomplete="current-password" required></label>
        <label>New action PIN (<span id="pin-rule">4 to 12 digits</span>) <input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" autocomplete="off" required></label>
        <div class="row">
          <button type="submit" class="btn btn-primary">Save PIN</button>
          <button type="button" id="pin-cancel" class="btn btn-ghost">Cancel</button>
        </div>
        <p class="error" role="alert"></p>
      </form>
    </div>
    <a id="menu-admin" class="menu-link" href="/admin/" hidden>Open the admin console</a>
    <button id="logout" type="button" class="btn btn-ghost">Sign out</button>
  </dialog>

  <template id="turn-user">
    <li class="turn user"><p class="turn-text"></p></li>
  </template>
  <template id="turn-ira">
    <li class="turn ira">
      <p class="turn-text"></p>
      <details class="how" hidden>
        <summary>How Ira got this</summary>
        <ul class="how-list"></ul>
      </details>
    </li>
  </template>
  <template id="turn-note">
    <li class="turn note"><p class="turn-text"></p></li>
  </template>
  <template id="action-template">
    <li class="turn action" data-status="pending">
      <p class="action-kicker">Needs a PIN</p>
      <p class="action-summary"></p>
      <p class="action-meta"><span class="action-who" hidden></span><span class="action-expiry"></span></p>
      <form class="action-form">
        <input class="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" autocomplete="off" placeholder="PIN" aria-label="Your PIN" required>
        <button type="submit" class="btn btn-primary">Confirm</button>
        <button type="button" class="btn btn-ghost cancel">Cancel</button>
      </form>
      <p class="action-status" role="status"></p>
    </li>
  </template>
</body>
</html>
