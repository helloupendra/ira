# gitleaks: the default rules plus a short allowlist of reviewed false positives.
# Keep entries narrow (one file or one literal) and say why each is safe.

[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives"
paths = [
  # The detect-secrets baseline stores SHA-1 hashes of strings already reviewed
  # as not secret; the hashes look like keys to the generic rule.
  '''^\.secrets\.baseline$''',
]
regexes = [
  # A fake key in tests/test_gateway.py that proves errors are scrubbed of credentials.
  '''^sk-test-0123456789abcdef$''',
  # The Chrome extension's PUBLIC key (manifest.json "key"): Chrome derives the
  # extension's id from it. It is meant to be public; no private key exists.
  '''^MIIBIjANBgkqhkiG9w0BAQEF[A-Za-z0-9+/=]+$''',
]
